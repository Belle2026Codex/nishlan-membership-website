<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nishlan Cashier</title><link rel="stylesheet" href="/style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script defer src="/app.js"></script></head><body><header><b>NISHLAN</b><nav><a href="/">Customer</a><a href="/admin/">Admin</a></nav></header><main><h1>Cashier QR verification</h1><div class="card" id="auth"><label>Email<input id="email"></label><label>Password<input type="password" id="password"></label><button onclick="signIn()">Open scanner</button></div><div id="signed" hidden><p id="who"></p><button class="small" onclick="signOut()">Sign out</button><div id="scanner" hidden><div id="camera"></div><label>Manual token<input id="token"></label><button onclick="verifyToken(document.getElementById('token').value)">Verify</button><pre id="result"></pre></div></div><p id="notice"></p></main></body></html>
