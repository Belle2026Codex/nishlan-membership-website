<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Nishlan Membership</title><link rel="stylesheet" href="/style.css"><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script defer src="/app.js"></script></head><body><header><b>NISHLAN <small style="font-size:12px">FoodLife & Marketing Inc.</small></b><nav><a href="/">Customer</a><a href="/admin/">Admin</a><a href="/cashier/">Cashier</a></nav></header><main><h1>Nishlan Membership Portal</h1><p>Apply for general or Eagles membership. Digital QR cards are issued after administrator approval and payment verification.</p><div class="card" id="auth"><h2>Customer account</h2><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password" minlength="10"></label><button onclick="signIn()">Sign in</button><button onclick="signUp()">Create account</button></div><div id="signed" hidden><p id="who"></p><button class="small" onclick="signOut()">Sign out</button><div class="card" id="application" hidden><h2>Membership application</h2><label>Full name<input id="full_name"></label><label>Phone<input id="phone"></label><label>Category<select id="membership_type"><option value="general">General</option><option value="eagles">Eagles</option></select></label><label>Eagles chapter (optional)<input id="chapter"></label><button onclick="submitApplication()">Submit</button></div><div class="card"><h2>My membership</h2><div id="member"></div></div></div><p id="notice"></p></main></body></html>
